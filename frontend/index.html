<!-- web page that has a box that shows the users camera feed -->

<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Camera App</title>



  <style>

    body {

      font-family: Times New Roman, sans-serif;

      background: #f3f4f6;

      margin: 0;

      display: flex;

      min-height: 100vh;
      
      display: flex;
      
      flex-direction: column;
      
      align-items: center;
      
      padding: 40px 20px;
      
      box-sizing: border-box;

    }



    .camera-box {

      width: 100%;
      
      max-width: 640px;
      
      aspect-ratio: 16 / 9;
      
      background: #111;
      
      border-radius: 12px;
      
      overflow: hidden;
      
      margin: 0 auto;
      
      box-sizing: border-box;

    }



    video {

      width: 100%;

      height: 100%;

      object-fit: cover;

      display: block;

    }



    button {

      margin-top: 20px;

      padding: 12px 24px;

      border: none;

      border-radius: 8px;

      background: #2563eb;

      color: white;

      font-size: 16px;

      cursor: pointer;

    }



    #status {

      color: #555;

    }

  </style>

</head>



<body>

  <h1>My Camera App</h1>

  <p>View your live camera feed below.</p>



  <div class="camera-box">

    <video id="camera" autoplay playsinline muted></video>

  </div>



  <button id="start">Start Camera</button>

  <p id="status">Camera is off.</p>



  <script>

    const video = document.getElementById("camera");

    const button = document.getElementById("start");

    const status = document.getElementById("status");



    let stream = null;



    button.addEventListener("click", async () => {

      if (stream) {

        stream.getTracks().forEach(track => track.stop());

        stream = null;

        video.srcObject = null;

        button.textContent = "Start Camera";

        status.textContent = "Camera is off.";

        return;

      }



      try {

        stream = await navigator.mediaDevices.getUserMedia({

          video: true,

          audio: false

        });



        video.srcObject = stream;

        button.textContent = "Stop Camera";

        status.textContent = "Camera is running.";

      } catch (error) {

        status.textContent =

          "Could not access camera. Check permissions.";

        console.error(error);

      }

    });

  </script>

</body>

</html>
